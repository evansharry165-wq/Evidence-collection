name: Nightly pull

on:
  schedule:
    # 03:00 UTC daily — after most European weather feeds refresh
    - cron: '0 3 * * *'
  workflow_dispatch: {}   # manual trigger button in the Actions tab

concurrency:
  group: nightly-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Run all source pulls
        id: run
        run: python run_all.py
        continue-on-error: false

      - name: Commit snapshots and manifest updates
        if: always()
        run: |
          git config user.name "evidence-collection[bot]"
          git config user.email "harryevans15@icloud.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Nightly pull $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

  notify-failure:
    needs: pull
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Log failure summary
        run: |
          echo "Nightly evidence pull failed. Owner will receive email notification from GitHub Actions."
          exit 1
